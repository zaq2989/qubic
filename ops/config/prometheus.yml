global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'relay'
    static_configs:
      - targets: ['relay:2112']
    
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['localhost:9100']