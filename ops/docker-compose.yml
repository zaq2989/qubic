version: '3.8'

services:
  # MinIO Storage
  minio:
    image: minio/minio:latest
    container_name: wargame-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - wargame-ops

  # Create MinIO bucket
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/wargame-artifacts || true;
      mc policy set public local/wargame-artifacts;
      exit 0;
      "
    networks:
      - wargame-ops

  # Relay Service
  relay:
    build:
      context: ..
      dockerfile: ops/Dockerfile.relay
    container_name: wargame-relay
    ports:
      - "8080:8080"  # HTTP API
      - "9090:9090"  # gRPC
    environment:
      - BLOCKCHAIN_ENDPOINT=qubic-node:10000
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    depends_on:
      - minio
      - qubic-node
    volumes:
      - ./config/relay.yaml:/etc/relay/config.yaml:ro
    networks:
      - wargame-ops
      - wargame-blockchain

  # Mock Qubic Node (for PoC)
  qubic-node:
    build:
      context: ..
      dockerfile: ops/Dockerfile.qubic-mock
    container_name: wargame-qubic-node
    ports:
      - "10000:10000"
    networks:
      - wargame-blockchain

  # Dashboard
  dashboard:
    build:
      context: ../dashboard
      dockerfile: ../ops/Dockerfile.dashboard
    container_name: wargame-dashboard
    ports:
      - "3000:3000"
    environment:
      - RELAY_API_URL=http://relay:8080/api
    depends_on:
      - relay
    networks:
      - wargame-ops

  # Attack Worker Pool
  attacker-1:
    build:
      context: ..
      dockerfile: sandbox/docker/Dockerfile.attacker
    container_name: wargame-attacker-1
    environment:
      - RELAY_ENDPOINT=http://relay:9090
      - WORKER_ID=attacker-1
    depends_on:
      - relay
    networks:
      - wargame-ops
      - wargame-sandbox
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  attacker-2:
    extends: attacker-1
    container_name: wargame-attacker-2
    environment:
      - RELAY_ENDPOINT=http://relay:9090
      - WORKER_ID=attacker-2

  # Defense Worker Pool
  defender-1:
    build:
      context: ..
      dockerfile: sandbox/docker/Dockerfile.defender
    container_name: wargame-defender-1
    environment:
      - RELAY_ENDPOINT=http://relay:9090
      - WORKER_ID=defender-1
    depends_on:
      - relay
    networks:
      - wargame-ops
      - wargame-sandbox
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  defender-2:
    extends: defender-1
    container_name: wargame-defender-2
    environment:
      - RELAY_ENDPOINT=http://relay:9090
      - WORKER_ID=defender-2

  # Monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: wargame-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - wargame-ops

  grafana:
    image: grafana/grafana:latest
    container_name: wargame-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - wargame-ops

networks:
  wargame-ops:
    driver: bridge
  wargame-blockchain:
    driver: bridge
  wargame-sandbox:
    driver: bridge
    internal: true  # No external access

volumes:
  minio-data:
  prometheus-data:
  grafana-data: