[package]
name = "wargame-attacker"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tonic = "0.10"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
ed25519-dalek = "2.0"
base64 = "0.21"
num_cpus = "1.16"

[build-dependencies]
tonic-build = "0.10"

[[bin]]
name = "attacker"
path = "src/main.rs"